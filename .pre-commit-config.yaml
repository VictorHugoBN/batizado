# Install once: make setup   (runs: uvx pre-commit install --install-hooks)
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: swift-format-lint
        name: swift format lint
        entry: make lint
        language: system
        pass_filenames: false
        files: (\.swift$|^\.swift-format$)
